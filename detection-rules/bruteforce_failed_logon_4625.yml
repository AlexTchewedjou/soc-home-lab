title: Multiple Failed Logons Against a Single Account (Brute Force)
id: 8f3d2b1a-4c7e-4a9b-9e21-1c0f5a6d2e34
status: experimental
description: |
  Detects repeated failed logon attempts (Windows Security Event ID 4625)
  which, when seen in a short burst against the same target account, indicate
  a password-guessing or brute-force attack. In this lab the burst was
  generated against a dedicated test account and culminated in an account
  lockout (Event ID 4740).
references:
  - https://attack.mitre.org/techniques/T1110/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
author: Alex Tchewedjou
date: 2026-10-27
tags:
  - attack.credential-access
  - attack.t1110            # Brute Force
  - attack.t1110.001        # Password Guessing
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  timeframe: 5m
  condition: selection | count() by TargetUserName >= 5
falsepositives:
  - A user repeatedly mistyping their own password
  - A service account with a stale cached credential
  - Account lockout testing by an administrator
level: high
